name: Build PickleVision iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        run: |
          set -e
          if [ -d "PickleVision" ] && [ -f "PickleVision/project.yml" ]; then
            cd PickleVision
          fi
          
          echo "=== 1. Generating Xcode project from project.yml ==="
          xcodegen generate
          
          echo "=== 2. Project Target Info ==="
          xcodebuild -project PickleVision.xcodeproj -list
          
          echo "=== 3. Compiling with xcodebuild (iOS Device target) ==="
          set +e
          xcodebuild \
            -project PickleVision.xcodeproj \
            -target PickleVision \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          BUILD_EXIT_CODE=$?
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "### ❌ Xcodebuild Compilation Failed (Code $BUILD_EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 xcodebuild.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_EXIT_CODE
          fi
          set -e
          
          echo "=== 4. Packaging into PickleVision.ipa ==="
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "PickleVision.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PickleVision.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PickleVision.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: "**/xcodebuild.log"
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickleVision-iOS-IPA
          path: "**/build/PickleVision.ipa"
          if-no-files-found: error
