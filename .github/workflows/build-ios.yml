name: Build PickleVision iOS IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        run: |
          if [ -d "PickleVision" ] && [ -f "PickleVision/project.yml" ]; then
            cd PickleVision
          fi
          
          echo "=== 1. Generating Xcode project from project.yml ==="
          xcodegen generate
          
          echo "=== 2. Project Target and Schemes Info ==="
          xcodebuild -project PickleVision.xcodeproj -list
          
          echo "=== 3. Compiling with xcodebuild (Ad-Hoc Signing) ==="
          set +e
          xcodebuild \
            -project PickleVision.xcodeproj \
            -scheme PickleVision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "==================== BUILD FAILED ===================="
            echo "Printing compilation errors found in xcodebuild.log:"
            grep -E "error:|fatal error:" xcodebuild.log || tail -n 80 xcodebuild.log
            echo "======================================================"
            
            # Đẩy lỗi ra GitHub Annotations để đọc được qua API
            grep -E "\.swift:[0-9]+:[0-9]+: error:" xcodebuild.log | while IFS= read -r line; do
              echo "::error title=Swift Compiler Error::$line"
            done
            grep -i "error:" xcodebuild.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Build Error::$line"
            done
            
            echo "### ❌ Xcodebuild Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            (grep -E "error:|fatal error:" xcodebuild.log || tail -n 80 xcodebuild.log) >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            exit $BUILD_EXIT_CODE
          fi
          set -e
          
          echo "=== 4. Packaging into PickleVision.ipa ==="
          APP_PATH=$(find build/DerivedData -name "PickleVision.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PickleVision.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          echo "=== 5. Verifying & injecting privacy keys into Info.plist ==="
          plutil -replace CFBundleShortVersionString -string "1.0.1" "$APP_PATH/Info.plist"
          plutil -replace CFBundleVersion -string "3" "$APP_PATH/Info.plist"
          plutil -replace NSCameraUsageDescription -string "PickleVision cần quyền truy cập Camera để phân tích đường bóng và vận động viên Pickleball theo thời gian thực (60/120fps)." "$APP_PATH/Info.plist"
          plutil -replace NSMicrophoneUsageDescription -string "PickleVision cần quyền Micro để ghi âm trận đấu khi xuất video highlight." "$APP_PATH/Info.plist"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "PickleVision cần quyền lưu video phân tích vào Thư viện ảnh." "$APP_PATH/Info.plist"
          plutil -replace NSPhotoLibraryUsageDescription -string "PickleVision cần quyền truy cập Thư viện ảnh để xem lại và xuất video trận đấu." "$APP_PATH/Info.plist"
          plutil -replace UILaunchScreen -xml "<dict/>" "$APP_PATH/Info.plist"
          echo "Verified Info.plist contents:"
          plutil -p "$APP_PATH/Info.plist"
          
          echo "=== 6. Re-signing ad-hoc after Info.plist injection ==="
          codesign --force --sign - --timestamp=none "$APP_PATH"
          
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PickleVision.ipa Payload
          cp PickleVision.ipa PickleVision_v1.0.1.ipa
          echo "IPA packaging completed successfully."

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: "**/xcodebuild.log"
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickleVision-iOS-IPA
          path: "**/build/*.ipa"
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PickleVision v1.0.1"
          body: |
            ## PickleVision v1.0.1 Release
            - ✅ Căn chỉnh ROI sân 10 điểm hình học (4 góc ngoài sân + 4 điểm bếp + 2 điểm cột lưới)
            - ✅ Độ chính xác Homography DLT SVD RMSE < 0.006m
            - ✅ Màn hình Home Onboarding: Bắt đầu, Thông tin, Thoát, nhãn version v1.0.1
            - ✅ Cấu hình trận đấu (Match Setup): Tên 4 cầu thủ & Người giao bóng đầu tiên
            - ✅ Chế độ vào trận Chưa Quay Liền với nút BẮT ĐẦU QUAY & TÍNH ĐIỂM (REC)
          files: |
            **/build/PickleVision_v1.0.1.ipa
            **/build/PickleVision.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
