name: Build PickleVision iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        run: |
          if [ -d "PickleVision" ] && [ -f "PickleVision/project.yml" ]; then
            cd PickleVision
          fi
          
          echo "=== 1. Generating Xcode project from project.yml ==="
          xcodegen generate
          
          echo "=== 2. Project Target and Schemes Info ==="
          xcodebuild -project PickleVision.xcodeproj -list
          
          echo "=== 3. Compiling with xcodebuild (Ad-Hoc Signing) ==="
          set +e
          xcodebuild \
            -project PickleVision.xcodeproj \
            -scheme PickleVision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "==================== BUILD FAILED ===================="
            echo "Printing compilation errors found in xcodebuild.log:"
            grep -E "error:|fatal error:" xcodebuild.log || tail -n 80 xcodebuild.log
            echo "======================================================"
            
            echo "### ❌ Xcodebuild Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            (grep -E "error:|fatal error:" xcodebuild.log || tail -n 80 xcodebuild.log) >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            exit $BUILD_EXIT_CODE
          fi
          set -e
          
          echo "=== 4. Packaging into PickleVision.ipa ==="
          APP_PATH=$(find build/DerivedData -name "PickleVision.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PickleVision.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          echo "=== 5. Verifying & injecting privacy keys into Info.plist ==="
          plutil -replace CFBundleShortVersionString -string "1.2.0" "$APP_PATH/Info.plist"
          plutil -replace CFBundleVersion -string "2" "$APP_PATH/Info.plist"
          plutil -replace NSCameraUsageDescription -string "PickleVision cần quyền truy cập Camera để phân tích đường bóng và vận động viên Pickleball theo thời gian thực (60/120fps)." "$APP_PATH/Info.plist"
          plutil -replace NSMicrophoneUsageDescription -string "PickleVision cần quyền Micro để ghi âm trận đấu khi xuất video highlight." "$APP_PATH/Info.plist"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "PickleVision cần quyền lưu video phân tích vào Thư viện ảnh." "$APP_PATH/Info.plist"
          plutil -replace NSPhotoLibraryUsageDescription -string "PickleVision cần quyền truy cập Thư viện ảnh để xem lại và xuất video trận đấu." "$APP_PATH/Info.plist"
          plutil -replace UILaunchScreen -xml "<dict/>" "$APP_PATH/Info.plist"
          echo "Verified Info.plist contents:"
          plutil -p "$APP_PATH/Info.plist"
          
          echo "=== 6. Re-signing ad-hoc after Info.plist injection ==="
          codesign --force --sign - --timestamp=none "$APP_PATH"
          
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PickleVision.ipa Payload
          cp PickleVision.ipa PickleVision_v1.2.ipa
          echo "IPA packaging completed successfully."

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: "**/xcodebuild.log"
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickleVision-iOS-IPA
          path: "**/build/*.ipa"
          if-no-files-found: error
