name: PickleVision
options:
  bundleIdPrefix: com.picklevision
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
targets:
  PickleVision:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Core
      - path: UI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PickleVision
        CFBundleIdentifier: com.picklevision.app
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "6"
        NSCameraUsageDescription: "PickleVision cần quyền truy cập Camera để phân tích đường bóng và vận động viên Pickleball theo thời gian thực (60/120fps)."
        NSMicrophoneUsageDescription: "PickleVision cần quyền Micro để ghi âm trận đấu khi xuất video highlight."
        NSPhotoLibraryAddUsageDescription: "PickleVision cần quyền lưu video phân tích vào Thư viện ảnh."
        NSPhotoLibraryUsageDescription: "PickleVision cần quyền truy cập Thư viện ảnh để xem lại và xuất video trận đấu."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: PickleVision
        PRODUCT_BUNDLE_IDENTIFIER: com.picklevision.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "PickleVision cần quyền truy cập Camera để phân tích đường bóng và vận động viên Pickleball theo thời gian thực (60/120fps)."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PickleVision cần quyền Micro để ghi âm trận đấu khi xuất video highlight."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "PickleVision cần quyền lưu video phân tích vào Thư viện ảnh."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PickleVision cần quyền truy cập Thư viện ảnh để xem lại và xuất video trận đấu."
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: YES

schemes:
  PickleVision:
    build:
      targets:
        PickleVision: all
