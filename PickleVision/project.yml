name: PickleVision
options:
  bundleIdPrefix: com.picklevision
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  PickleVision:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Core
      - path: UI
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_NAME: PickleVision
        PRODUCT_BUNDLE_IDENTIFIER: com.picklevision.app
        GENERATE_INFOPLIST_FILE: NO
