name: Build PickleVision iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        run: |
          if [ -d "PickleVision" ] && [ -f "PickleVision/project.yml" ]; then
            cd PickleVision
          fi
          
          echo "=== 1. Generating Xcode project from project.yml ==="
          xcodegen generate
          
          echo "=== 2. Compiling with xcodebuild (iOS Device target) ==="
          xcodebuild \
            -project PickleVision.xcodeproj \
            -scheme PickleVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PickleVision.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
            
          echo "=== 3. Packaging into PickleVision.ipa ==="
          mkdir -p build/Payload
          cp -R build/PickleVision.xcarchive/Products/Applications/PickleVision.app build/Payload/
          cd build
          zip -r PickleVision.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickleVision-iOS-IPA
          path: "**/build/PickleVision.ipa"
          if-no-files-found: error
